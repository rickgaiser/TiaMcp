name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ASSISTANT_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/<owner>/<repo>/blob/main/CLA.md"
          branch: "main"
          allowlist: "<owner>"
          remote-organization-name: ""
          remote-repository-name: ""
          create-file-commit-message: "Create signatures file"
          signed-commit-message: "$contributorName has signed the CLA in $owner/$repo#$pullRequestNo"
          custom-notsigned-prcomment: "Thanks for the contribution! Please sign the [CLA](https://github.com/<owner>/<repo>/blob/main/CLA.md) below before this can be merged."
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
